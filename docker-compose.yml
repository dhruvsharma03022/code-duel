version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: codeduel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: codeduel
      POSTGRES_USER: codeadmin
      POSTGRES_PASSWORD: codepassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - codeduel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeadmin -d codeduel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: codeduel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - codeduel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeduel-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://codeadmin:codepassword123@postgres:5432/codeduel
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: codeduel
      DB_USER: codeadmin
      DB_PASSWORD: codepassword123
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secret-jwt-key-change-in-production
      JWT_EXPIRES_IN: 7d
      PISTON_API_URL: https://emkc.org/api/v2/piston
      FRONTEND_URL: http://localhost:5173
      INVITE_EXPIRY_HOURS: 24
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - codeduel-network
    command: npm run dev

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeduel-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_SOCKET_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - codeduel-network
    command: npm run dev -- --host

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  codeduel-network:
    driver: bridge
