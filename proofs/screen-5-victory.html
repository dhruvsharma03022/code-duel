<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen 5 - Victory | CodeDuel Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .figma-frame {
            width: 1440px;
            height: 1024px;
            background: #0a0e1a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .figma-header {
            position: absolute;
            top: -35px;
            left: 0;
            right: 0;
            background: white;
            padding: 8px 16px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }

        .frame-name {
            font-weight: 600;
            color: #000;
        }

        .wireframe {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Victory Card */
        .victory-card {
            background: #131826;
            border: 2px solid #1e2842;
            border-radius: 32px;
            padding: 80px 64px;
            text-align: center;
            max-width: 700px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            animation: victoryPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes victoryPop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Trophy Icon */
        .trophy-icon {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #00ff88, #00aaff);
            border-radius: 50%;
            margin: 0 auto 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
            animation: trophyFloat 3s ease-in-out infinite;
        }

        @keyframes trophyFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        .victory-title {
            font-size: 64px;
            font-weight: 900;
            background: linear-gradient(135deg, #00ff88, #00aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        .victory-subtitle {
            font-size: 20px;
            color: #8892b0;
            margin-bottom: 48px;
        }

        /* Rating Change Card */
        .rating-change-card {
            background: #0a0e1a;
            border: 1px solid #1e2842;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 48px;
        }

        .rating-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .rating-row:last-child {
            margin-bottom: 0;
            padding-top: 24px;
            border-top: 2px solid #1e2842;
        }

        .rating-label {
            color: #8892b0;
        }

        .rating-value {
            font-size: 20px;
            font-weight: 700;
            color: #e0e6ff;
        }

        .rating-change {
            font-size: 32px;
            font-weight: 900;
            color: #00ff88;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rating-change::before {
            content: '✨';
            font-size: 24px;
        }

        .new-rating {
            font-size: 32px;
            font-weight: 900;
            color: #00ff88;
        }

        /* Action Buttons */
        .victory-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .btn {
            padding: 18px 48px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #1e2842;
            color: #e0e6ff;
        }

        .btn-secondary:hover {
            border-color: #2a3550;
            background: #1e2842;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #00ff88;
            color: #0a0e1a;
        }

        .btn-primary:hover {
            background: #00cc6a;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        /* Confetti effect */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: #00ff88;
            animation: confettiFall 3s linear infinite;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(1200px) rotate(720deg);
                opacity: 0;
            }
        }

        .confetti:nth-child(1) {
            left: 10%;
            animation-delay: 0s;
            background: #00ff88;
        }

        .confetti:nth-child(2) {
            left: 30%;
            animation-delay: 0.5s;
            background: #00aaff;
        }

        .confetti:nth-child(3) {
            left: 50%;
            animation-delay: 1s;
            background: #ff6b9d;
        }

        .confetti:nth-child(4) {
            left: 70%;
            animation-delay: 1.5s;
            background: #ffaa00;
        }

        .confetti:nth-child(5) {
            left: 90%;
            animation-delay: 2s;
            background: #00ff88;
        }

        /* Background glow */
        .glow-bg {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.15), transparent);
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .annotation {
            position: absolute;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="figma-frame">
        <div class="figma-header">
            <span class="frame-name">Screen 5 - Victory Screen</span>
            <span style="margin-left: 8px; color: #999;">1440 × 1024</span>
        </div>

        <div class="wireframe">
            <div class="glow-bg"></div>

            <!-- Confetti -->
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>

            <div class="victory-card">
                <div class="trophy-icon">🏆</div>

                <h1 class="victory-title">Victory!</h1>
                <p class="victory-subtitle">You solved the problem in 4:23</p>

                <div class="rating-change-card">
                    <div class="rating-row">
                        <span class="rating-label">Previous Rating</span>
                        <span class="rating-value">1547</span>
                    </div>

                    <div class="rating-row">
                        <span class="rating-label">Rating Change</span>
                        <span class="rating-change">+18</span>
                    </div>

                    <div class="rating-row">
                        <span class="rating-label" style="font-weight: 700; color: #e0e6ff;">New Rating</span>
                        <span class="new-rating">1565</span>
                    </div>
                </div>

                <div class="victory-actions">
                    <button class="btn btn-secondary">Back to Lobby</button>
                    <button class="btn btn-primary">
                        <span>⚔️</span>
                        <span>New Match</span>
                    </button>
                </div>
            </div>

            <!-- Annotations -->
            <div class="annotation" style="top: 180px; left: 180px;">Trophy Animation</div>
            <div class="annotation" style="bottom: 220px; right: 180px;">Rating Change</div>
        </div>
    </div>
</body>
</html>
