<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen 3 - Invite Modal | CodeDuel Wireframe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .figma-frame {
            width: 1440px;
            height: 1024px;
            background: #0a0e1a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .figma-header {
            position: absolute;
            top: -35px;
            left: 0;
            right: 0;
            background: white;
            padding: 8px 16px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 13px;
            color: #666;
        }

        .frame-name {
            font-weight: 600;
            color: #000;
        }

        .frame-size {
            color: #999;
            margin-left: 8px;
        }

        .wireframe {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 8, 16, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modal */
        .modal {
            background: #131826;
            border: 1px solid #1e2842;
            border-radius: 24px;
            width: 600px;
            padding: 48px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .modal-header {
            margin-bottom: 32px;
        }

        .close-btn {
            position: absolute;
            top: 24px;
            right: 24px;
            background: transparent;
            border: none;
            color: #8892b0;
            font-size: 24px;
            cursor: pointer;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }

        .close-btn:hover {
            background: #1e2842;
            color: #e0e6ff;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
        }

        .modal-subtitle {
            font-size: 16px;
            color: #8892b0;
        }

        /* Invite Link Box */
        .invite-link-container {
            background: #0a0e1a;
            border: 2px solid #1e2842;
            border-radius: 12px;
            padding: 20px;
            margin: 32px 0;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .invite-link {
            flex: 1;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            color: #00ff88;
            background: transparent;
            border: none;
            outline: none;
        }

        .copy-btn {
            background: #00ff88;
            color: #0a0e1a;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #00cc6a;
            transform: scale(1.05);
        }

        .copy-icon {
            font-size: 16px;
        }

        /* Expiry Info */
        .expiry-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 32px;
        }

        /* Modal Footer */
        .modal-footer {
            display: flex;
            gap: 16px;
        }

        .btn {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid #1e2842;
            color: #e0e6ff;
        }

        .btn-secondary:hover {
            border-color: #2a3550;
            background: #1e2842;
        }

        .btn-primary {
            background: #00ff88;
            color: #0a0e1a;
        }

        .btn-primary:hover {
            background: #00cc6a;
            transform: scale(1.02);
        }

        /* Background blur effect */
        .blur-bg {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 255, 136, 0.1), transparent);
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }

        .blur-bg-1 {
            top: -200px;
            right: -200px;
        }

        .blur-bg-2 {
            bottom: -200px;
            left: -200px;
            background: radial-gradient(circle, rgba(102, 126, 234, 0.1), transparent);
        }

        .annotation {
            position: absolute;
            background: #ff6b6b;
            color: white;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="figma-frame">
        <div class="figma-header">
            <span class="frame-name">Screen 3 - Invite Modal</span>
            <span class="frame-size">1440 × 1024</span>
        </div>

        <div class="wireframe">
            <div class="blur-bg blur-bg-1"></div>
            <div class="blur-bg blur-bg-2"></div>

            <div class="modal-overlay">
                <div class="modal">
                    <button class="close-btn">✕</button>

                    <div class="modal-header">
                        <h2 class="modal-title">Create Invite Link</h2>
                        <p class="modal-subtitle">Share this link with your opponent to start a match</p>
                    </div>

                    <div class="invite-link-container">
                        <input type="text" class="invite-link" value="https://codeduel.io/join/abc123xyz" readonly>
                        <button class="copy-btn">
                            <span class="copy-icon">📋</span>
                            Copy
                        </button>
                    </div>

                    <div class="expiry-info">
                        <span>⏰</span>
                        <span>Expires in 24 hours</span>
                    </div>

                    <div class="modal-footer">
                        <button class="btn btn-secondary">Cancel</button>
                        <button class="btn btn-primary">Start Match →</button>
                    </div>
                </div>
            </div>

            <!-- Annotations -->
            <div class="annotation" style="top: 200px; left: 200px;">Modal Overlay</div>
            <div class="annotation" style="top: 350px; right: 250px;">Invite Link</div>
        </div>
    </div>

    <script>
        document.querySelector('.copy-btn').addEventListener('click', function() {
            const linkInput = document.querySelector('.invite-link');
            linkInput.select();
            document.execCommand('copy');
            this.innerHTML = '<span class="copy-icon">✓</span> Copied!';
            this.style.background = '#00cc6a';
            
            setTimeout(() => {
                this.innerHTML = '<span class="copy-icon">📋</span> Copy';
                this.style.background = '#00ff88';
            }, 2000);
        });
    </script>
</body>
</html>
